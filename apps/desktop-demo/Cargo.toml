[package]
name = "desktop-demo"
version = "0.1.0"
edition = "2024"
default-run = "desktop-demo"

[[bin]]
name = "desktop-demo"
path = "src/main.rs"

[features]
default = []
qualification = ["raster-render-path/qualification", "compute-ray-render-path/qualification", "voxel-frontend/qualification", "render-backend/qualification"]

[dependencies]
ash = "0.38.0"
ash-window = "0.13.0"
canonical-inspection = { path = "../../crates/canonical-inspection" }
canonical-scene = { path = "../../crates/canonical-scene" }
compute-ray-render-path = { path = "../../crates/compute-ray-render-path" }
measurement-evidence = { path = "../../crates/measurement-evidence" }
raw-window-handle = "0.6.2"
render-backend = { path = "../../crates/render-backend" }
raster-render-path = { path = "../../crates/raster-render-path" }
semantic-ray-oracle = { path = "../../crates/semantic-ray-oracle" }
serde_json = "1.0"
voxel-frontend = { path = "../../crates/voxel-frontend" }
winit = "0.30.12"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59.0", features = ["Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.59.0", features = ["Win32_Graphics_Gdi", "Win32_Graphics_Dwm"] }

[lints]
workspace = true

[[bin]]
name = "large-sparse-measurement"
path = "src/large_sparse_measurement.rs"
required-features = ["qualification"]

[[bin]]
name = "streamed-residency-qualification"
path = "src/streamed_residency_qualification.rs"
required-features = ["qualification"]

[[bin]]
name = "streamed-fixture-profile"
path = "src/streamed_fixture_profile.rs"
required-features = ["qualification"]
